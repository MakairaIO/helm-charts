domain: "shop.k8s.makaira.io"

ingress:
  # Set enabled: false to let the Ingress be managed elsewhere (e.g. a central chart).
  enabled: true
  # IngressClass to use. Defaults to "nginx"; set to "nginx-f5" for the F5 controller.
  className: nginx

imagePullSecrets:
  - name: ""
    repo: ""
    auth: ""

imagePullPolicy: "IfNotPresent"

shop:
  image:
    name: php
    tag: 8.4-fpm
  sharedAssets:
    enabled: false
    storageClass: ""
    storageSize: "5Gi"
  envVars: {}
  initCommands: []
  persistence: []
  # Optional shell command run as a postStart lifecycle hook in the shop
  # container. Left empty by default (no lifecycle hook is rendered). Useful to
  # reconcile ephemeral install state on start, e.g. regenerate JWT keys or
  # recreate an install lock file.
  postStartCommand: ""

nginx:
  image:
    name: nginx
    tag: stable
  locations: |-
    location / {
      gzip_static on;
      try_files $uri @php;
    }

    location @php {
      include fastcgi_params;
      fastcgi_pass 127.0.0.1:9000;
      fastcgi_index index.php;
      fastcgi_param SCRIPT_FILENAME /app/public/$fastcgi_script_name;
    }

database:
  image:
    name: mysql
    tag: 8.0
  name: "database"
  user: "username"
  password: "password"
  rootPassword: "SetYourOwnRootPassword!"
  storageSize: "5Gi"
  initialDumps: []
