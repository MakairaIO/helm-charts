apiVersion: v1
kind: Service
metadata:
  name: {{ include "demoshop.name" $ }}-database
  namespace: {{ .Release.Namespace }}
  labels:
    {{ include "demoshop.labels" $ | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{ include "demoshop.selectorLabels" $ | nindent 4 }}
    app.kubernetes.io/app: database
  ports:
    - protocol: TCP
      port: 3306
      targetPort: 3306
