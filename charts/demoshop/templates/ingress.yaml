apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "demoshop.name" $ }}-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    {{ include "demoshop.labels" $ | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
      - "{{ .Values.domain }}"
      secretName: {{ include "demoshop.name" $ }}-tls
  rules:
    - host: "{{ .Values.domain }}"
      http:
        paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: {{ include "demoshop.name" $ }}-service
              port:
                number: 80
---
