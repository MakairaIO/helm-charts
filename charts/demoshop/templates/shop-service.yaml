apiVersion: v1
kind: Service
metadata:
  name: {{ include "demoshop.name" $ }}-service
  namespace: {{ .Release.Namespace }}
  labels:
    {{ include "demoshop.labels" $ | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{ include "demoshop.selectorLabels" $ | nindent 6 }}
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
