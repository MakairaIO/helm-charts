apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "demoshop.name" $ }}-cert
  namespace: {{ .Release.Namespace }}
  labels:
    {{ include "demoshop.labels" . | nindent 4 }}
spec:
  secretName: {{ include "demoshop.name" $ }}-tls
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: le-issuer
  commonName: "{{ .Values.domain }}"
  dnsNames:
    - "{{ .Values.domain }}"
