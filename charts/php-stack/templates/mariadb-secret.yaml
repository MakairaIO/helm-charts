{{- /*
  Auth secret for the cloudpirates/mariadb subchart, rendered here instead of by it.

  WHY: the subchart generates the exporter password as

      metricsExporterPassword: {{ `{{ $existing | default (randAlphaNum 32 | b64enc) }}` }}

  resolving the current value via `lookup`. ArgoCD renders with plain `helm template`,
  where `lookup` always returns empty, so it mints a NEW random password on every
  render. That leaves the Secret permanently OutOfSync, and any sync that applies it
  breaks the metrics exporter: MariaDB created the exporter user with the ORIGINAL
  password and is not re-initialised, because its data directory already exists.

  Rendering it here makes every render byte-identical. values.yaml points
  `mariadb.auth.existingSecret` at this Secret, which makes the subchart skip its own
  via `{{ `{{- if and (not .Values.auth.existingSecret) .Values.auth.enabled }}` }}`.
  Consumers need no extra configuration: set `mariadb.auth.metricsPassword` to pin the
  exporter password explicitly, or omit it and a stable value is derived from the root
  password (see php-stack.mariadb.metricsPassword).

  The name deliberately matches what the subchart would have generated, so the
  StatefulSet's secretKeyRef is unchanged and adopting this does NOT restart the
  database pod.

  Key names are fixed by the subchart: rootPasswordKey / userPasswordKey come from
  its `auth.secretKeys`, while `metricsExporterPassword` is hard-coded in its
  statefulset.yaml.
*/ -}}
{{- if .Values.mariadb.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "php-stack.mariadb.secretName" . }}
  labels:
    app.kubernetes.io/name: {{ .Values.mariadb.nameOverride | default "mariadb" }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/component: mariadb-auth
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version }}
type: Opaque
stringData:
  mariadb-root-password: {{ required "mariadb.auth.rootPassword is required when mariadb.enabled" .Values.mariadb.auth.rootPassword | quote }}
  mariadb-password: {{ required "mariadb.auth.password is required when mariadb.enabled" .Values.mariadb.auth.password | quote }}
  metricsExporterPassword: {{ include "php-stack.mariadb.metricsPassword" . | quote }}
{{- end }}
